- name: Build Android Project
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          STATUS=$?

          echo ""
          echo "========================================"
          echo "        REAL BUILD ERROR"
          echo "========================================"

          echo ""
          echo "---- WHAT WENT WRONG ----"
          sed -n '/FAILURE:/,/BUILD FAILED/p' build.log | head -150

          echo ""
          echo "---- IMPORTANT ERRORS ----"
          grep -nE "What went wrong|Could not|Caused by:|e: |error: |Exception:" build.log | tail -80 || true

          echo ""
          echo "---- END OF LOG ----"
          tail -50 build.log

          echo ""
          echo "========================================"

          exit $STATUS
