name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q ABIR_Gaming_Assistant_V3_CloudBuild.zip
          chmod +x ABIR_Gaming_Assistant_V3_CloudBuild/gradlew

      - name: Build Debug APK
        run: |
          gradle -p ABIR_Gaming_Assistant_V3_CloudBuild assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABIR-Gaming-Assistant-APK
          path: ABIR_Gaming_Assistant_V3_CloudBuild/app/build/outputs/apk/debug/*.apk
